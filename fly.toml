# Fly.io configuration.
#
# Rename the app before deploying: fly apps create <your-name>

app = "starkbank-invoice-transfer"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATABASE_URL = "sqlite:////data/app.db"

# The SQLite file must outlive the machine, otherwise a restart would replay
# the batch schedule and lose the idempotency ledger.
[[mounts]]
  source = "starkbank_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keeping one machine warm avoids a cold start swallowing a webhook delivery.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
